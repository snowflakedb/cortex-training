[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-training"
version = "0.1.1"
description = "Python SDK and command-line tools for Cortex Training"
readme = "README.md"
# 3.10 is the real floor: torch, safetensors and tenacity all require >=3.10,
# and the package uses PEP 604 (`X | None`) annotations at runtime.
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "requests>=2.28.0",
    "tenacity>=8.2.0",
    "snowflake-connector-python>=3.17.0,<5",
    # Used directly to read and write Snowflake profile files (see _profiles.py);
    # the ranges stay within snowflake-connector-python's own requirements.
    "filelock>=3.10.0,<4",
    "platformdirs>=2.6.0,<5.0.0",
    "tomlkit>=0.11.0",
    "torch",
    # cortex_training.wire uses safetensors.torch, which imports numpy, and
    # calls Tensor.numpy() directly; the [torch] extra is what declares numpy.
    "safetensors[torch]",
    # The TUI is tested on this Textual and relies on its behavior (keep
    # cortex_training/tui/__main__.py's TEXTUAL_FLOOR in step).
    "textual>=8.2.8,<9",
    "pydantic>=2.0.0"
]

[project.scripts]
cortex-training = "cortex_training.cli:main"
ct = "cortex_training.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
    "ruff==0.17.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cortex_training*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
# The agent skill ships with the package (see `cortex-training skills install`).
cortex_training = ["skills/*/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# Docstring lint for the public API; see "Public API docstrings" in AGENTS.md.
# Run it with `ruff check`. `include` lists the modules that define the names in
# cortex_training.__all__ (tests/test_public_api_docstrings.py keeps it complete),
# and Ruff reads each module's own `__all__` to tell public from internal for D1xx.
[tool.ruff]
include = [
    "src/cortex_training/client/_account_jobs.py",
    "src/cortex_training/client/core.py",
    "src/cortex_training/model_deployment.py",
    "src/cortex_training/_artifact_download.py",
]

[tool.ruff.lint]
# The pydoclint (DOC) rules are still preview rules, so enable them by explicit code.
preview = true
explicit-preview-rules = true
# DOC502 (documented exception not raised in the body) is left out: it can't see an
# exception that a helper or a library raises, so it flags accurate Raises sections.
select = ["D", "DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501"]
# Magic methods aren't documented API.
ignore = ["D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
# Internal helpers have one-line docstrings that don't need a Returns or Raises section.
ignore-one-line-docstrings = true
